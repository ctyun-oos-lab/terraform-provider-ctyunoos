# Single consolidated golangci-lint config (merged from the original five
# sharded configs .golangci{,2,3,4,5}.yml).
# The OOS codebase is small, so there is no need to shard runs by linter initial.
version: "2"
linters:
  default: none
  enable:
    # a-e
    - asasalint
    - asciicheck
    - bidichk
    - containedctx
    - contextcheck
    - copyloopvar
    - decorder
    - dogsled
    - durationcheck
    - errcheck
    - errname
    - errorlint
    # f-m
    - goconst
    - gocritic
    - govet
    - importas
    - ineffassign
    - makezero
    - misspell
    - mnd
    # n-s
    - nakedret
    - nilerr
    - nilnesserr
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - predeclared
    - reassign
    - revive
    - staticcheck
    # t-z
    - tagalign
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    copyloopvar:
      check-alias: true
    dogsled:
      max-blank-identifiers: 3
    errcheck:
      exclude-functions:
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceData).Set
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceDiff).SetNewComputed
        - (*github.com/hashicorp/terraform-plugin-sdk/v2/helper/schema.ResourceDiff).ForceNew
        - (io.ReadCloser).Close
        - (io.WriteCloser).Close
        - (*os.File).Close
        - os.Remove
        - os.Setenv
        - os.Unsetenv
    goconst:
      min-occurrences: 6
    gocritic:
      enabled-tags:
        - diagnostic
      disabled-tags:
        - experimental
        - opinionated
        - performance
        - style
    importas:
      no-unaliased: true
      alias:
        - pkg: github.com/hashicorp/terraform-plugin-sdk/v2/helper/id
          alias: sdkid
        - pkg: github.com/hashicorp/terraform-plugin-sdk/v2/helper/retry
          alias: sdkretry
        - pkg: "github.com/hashicorp/terraform-plugin-testing/helper/acctest"
          alias: sdkacctest
        - pkg: github.com/ctyun-oos-lab/terraform-provider-ctyunoos/internal/types
          alias: inttypes
        - pkg: github.com/ctyun-oos-lab/terraform-provider-ctyunoos/internal/retry
          alias: ""
    mnd:
      checks:
        - argument
      ignored-functions:
        # AWS Go SDK
        - aws.Int32
        - aws.Int64
        - request.ConstantWaiterDelay
        - request.WithWaiterMaxAttempts
        # AWS Provider
        - nullable.*
        - tfresource.Retry*
        - tfresource.With*
        - verify.StringUTF8LenBetween
        # Terraform Plugin SDK
        - retry.RetryContext
        - schema.DefaultTimeout
        - validation.*
        - floatBetweenSchema
        - intBetweenSchema
        - stringLenBetweenSchema
        # Terraform Plugin Framework
        - fwactions.TimeoutOr
        - int32validator.*
        - int64validator.*
        - listvalidator.*
        - mapvalidator.*
        - setvalidator.*
        - stringvalidator.*
        - SetDefaultCreateTimeout
        - SetDefaultReadTimeout
        - SetDefaultUpdateTimeout
        - SetDefaultDeleteTimeout
        # Go
        - make
        - strconv.FormatFloat
        - strconv.FormatInt
        - strconv.ParseFloat
        - strconv.ParseInt
        - strings.SplitN
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-no-explanation:
        - mnd
        - paralleltest
        - tparallel
        - unparam
      allow-unused: false
    perfsprint:
      int-conversion: true
      err-error: false
      errorf: false
      sprintf1: true
      strconcat: false
    predeclared:
      ignore:
        - cap
        - close
        - copy
        - delete
        - len
        - new
        - min
        - max
    revive:
      confidence: 0.8
      severity: warning
      rules:
        - name: atomic
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: errorf
        - name: range
        - name: receiver-naming
        - name: superfluous-else
        - name: time-naming
        - name: unreachable-code
        - name: var-declaration
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1020", "-ST1021", "-ST1022", "-QF1001", "-QF1004", "-QF1006", "-QF1007"]
      initialisms: ["ACL", "ACM", "ACMPCA", "ACMPCA", "AMI", "API", "APIGateway", "AppConfig", "AppMesh", "AppSync", "ARN", "ASG", "ASN", "AutoScaling", "BGP", "BYOIP", "CIDR", "CloudFormation", "CloudFront", "CloudWatch", "CMK", "CNAME", "CoIP", "CPU", "CSS", "CSV", "DAX", "DB", "DHCP", "DKIM", "DLM", "DMS", "DNS", "DNSSEC", "DocDB", "DocDB", "DynamoDB", "DynamoDB", "EBS", "EC2", "ECMP", "ECR", "ECS", "EFS", "EIP", "EKS", "ElastiCache", "Elasticsearch", "ELB", "EMR", "FIFO", "FMS", "FQDNS", "FSx", "FSx", "GameLift", "GCM", "GP2", "GP3", "GraphQL", "GRPC", "GuardDuty", "HAProxy", "HSM", "HTTP", "HTTPS", "HVM", "IAM", "IoT", "IP", "IPAM", "IPSet", "iSCSI", "JDBC", "JSON", "KMS", "MFA", "MSK", "MWAA", "MySQL", "NFS", "OAuth", "OIDC", "OpsWorks", "PHP", "PITR", "POSIX", "PreCheck", "QLDB", "RabbitMQ", "RDS", "RFC", "SageMaker", "SASL", "SFN", "SMB", "SMS", "SMTP", "SNS", "SQL", "SQS", "SSH", "SSL", "SSM", "SSO", "STS", "SWF", "TCP", "TLS", "TTL", "URI", "URL", "VGW", "VoIP", "VPC", "VPN", "WAF", "WAFV2", "WorkGroup", "WorkLink", "WorkSpaces", "XRay", "XSS", "YAML"]
    tagalign:
      align: false
      sort: true
      order:
        - json
        - tfsdk
        - autoflex
    usetesting:
      os-setenv: true
      context-background: false
      context-todo: false
  exclusions:
    generated: strict
    rules:
      # goconst: repeated literals in test files are acceptable
      - path: '(.+)_test\.go'
        linters:
          - goconst
      # paralleltest / tparallel: acceptance tests (TestAcc) are not required to run in parallel
      # Matches both "Function TestAcc..." and "Range statement for test TestAcc..." messages
      - linters:
          - paralleltest
        text: TestAcc
      - linters:
          - tparallel
        text: TestAcc
      # paralleltest / tparallel: unit tests are not required to run in parallel
      # Many unit tests use t.Setenv (mutually exclusive with t.Parallel); unit tests
      # run fast, gain little from parallelism, and forcing it may introduce flakiness.
      # Unit test naming is inconsistent (TestUnit/TestS3/TestFlatten, etc.), so exempt
      # by the _unit_test.go file path.
      - linters:
          - paralleltest
        text: TestUnit
      - linters:
          - tparallel
        text: TestUnit
      - linters:
          - paralleltest
          - tparallel
        path: _unit_test\.go
      - linters:
          - perfsprint
        path: _test\.go
      # contextcheck: test fixtures intentionally use context.Background() in
      # t.Cleanup callbacks, since the test's own ctx (from acctest.Context) may
      # already be cancelled by the time cleanup runs.
      - linters:
          - contextcheck
        path: _test\.go
      - linters:
          - unparam
        text: always receives
      # staticcheck: allowlist of deprecated APIs common to the SDK/Provider
      - linters:
          - staticcheck
        text: 'SA1019: \w+.GetOkExists is deprecated: usage is discouraged due to undefined behaviors and may be removed in a future version of the SDK'
      - linters:
          - staticcheck
        text: 'SA1019: schema.SchemaValidateFunc is deprecated: please use SchemaValidateDiagFunc'
      - linters:
          - staticcheck
        text: 'SA1019: acctest.ConfigAlternateRegionProvider is deprecated: Use ConfigMultipleRegionProvider instead'
      - linters:
          - staticcheck
        text: MigrateState is deprecated and any new changes to a resource's schema should be handled by StateUpgraders.
      - linters:
          - staticcheck
        text: 'SA1019: \w+\.\w+ is deprecated: Use \w+Context or \w+WithoutTimeout instead'
      - linters:
          - staticcheck
        text: 'SA1019: tfresource.\w+ is deprecated: \w+ is an alias to a function of the same name in internal/retry which handles both Plugin SDK V2 and internal error types. For net-new usage, prefer calling retry.\w+ directly.'
      # staticcheck: deprecated APIs in the s3 service (the only relevant service OOS retains)
      - linters:
          - staticcheck
        path: internal/service/s3/
        text: 'SA1019: \w+\.\w+ is deprecated:'
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
run:
  timeout: 75m
